<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mermaid to TGF</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #1a1b26;
      color: #c0caf5;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      gap: 0.75rem;
      padding: 0.75rem;
      height: 100vh;
      max-width: 1600px;
      margin: 0 auto;
    }
    h1 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: #7aa2f7;
    }
    .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #3b4261;
      background: #24283b;
    }
    .panel label {
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #565f89;
      border-bottom: 1px solid #3b4261;
    }
    .panel textarea {
      flex: 1;
      min-height: 10rem;
      padding: 0.75rem;
      font-family: ui-monospace, monospace;
      font-size: 0.875rem;
      line-height: 1.5;
      resize: none;
      border: none;
      background: #1a1b26;
      color: #c0caf5;
    }
    .panel textarea::placeholder {
      color: #565f89;
    }
    .panel textarea:focus {
      outline: none;
      box-shadow: inset 0 0 0 2px #7aa2f7;
    }
    .panel textarea.readonly {
      cursor: default;
      color: #a9b1d6;
    }
    .toolbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .toolbar .spacer { flex: 1; }
    .btn {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #7aa2f7;
      color: #1a1b26;
    }
    .btn:hover {
      background: #89b4fa;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="layout">
    <h1>Mermaid flowchart → TGF</h1>

    <div class="panel">
      <label for="mermaid">Mermaid flowchart (editable)</label>
      <textarea id="mermaid" placeholder="Paste a flowchart or leave empty for demo…"></textarea>
    </div>

    <div class="panel">
      <label for="tgf">TGF output (Trivial Graph Format)</label>
      <textarea id="tgf" class="readonly" readonly></textarea>
    </div>

    <div class="toolbar">
      <span class="spacer"></span>
      <button type="button" class="btn" id="download">Download graph.tgf</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
