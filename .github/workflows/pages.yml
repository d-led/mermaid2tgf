name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: npm ci
      - run: npm run test
      - run: npm run go:test
      - run: npm run build
      - run: mkdir -p publish/dist && cp static/index.html static/index.css publish/ && cp dist/app.js publish/dist/
      - run: sed -i "s/__BUILD_SHA__/${GITHUB_SHA::7}/g" publish/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
